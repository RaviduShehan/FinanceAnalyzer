spring:
  application:
    name: finance-api

  datasource:
    url: jdbc:mysql://localhost:3306/finance_db
    username: finance_user
    password: finance_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080